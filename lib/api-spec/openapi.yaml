openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BasePay — USDC Payments on Base Network
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Address book contacts
  - name: payment-requests
    description: Shareable payment request links
  - name: stats
    description: Payment statistics
  - name: app
    description: dApp registration and configuration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: ownerAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Remove a contact (owner-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: ownerAddress
          in: query
          required: true
          schema:
            type: string
          description: Wallet address of the contact owner — only that owner's contact is deleted
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /payment-requests:
    get:
      operationId: listPaymentRequests
      tags: [payment-requests]
      summary: List payment requests for an address
      parameters:
        - name: recipientAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of payment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRequest"
    post:
      operationId: createPaymentRequest
      tags: [payment-requests]
      summary: Create a shareable payment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestInput"
      responses:
        "201":
          description: Payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /payment-requests/{id}:
    get:
      operationId: getPaymentRequest
      tags: [payment-requests]
      summary: Get a payment request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePaymentRequest
      tags: [payment-requests]
      summary: Mark payment request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestUpdate"
      responses:
        "200":
          description: Updated payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /stats/{address}:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get payment stats for a wallet address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStats"

  /app/config:
    get:
      operationId: getAppConfig
      tags: [app]
      summary: Get dApp registration and fee configuration
      responses:
        "200":
          description: App config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    post:
      operationId: registerApp
      tags: [app]
      summary: Register or update dApp configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegisterInput"
      responses:
        "200":
          description: Updated app config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Contact:
      type: object
      required: [id, name, walletAddress, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        walletAddress:
          type: string
        ensName:
          type: ["string", "null"]
        ownerAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    ContactInput:
      type: object
      required: [name, walletAddress]
      properties:
        name:
          type: string
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
        ensName:
          type: string
        ownerAddress:
          type: string

    PaymentRequest:
      type: object
      required: [id, recipientAddress, amount, token, status, createdAt]
      properties:
        id:
          type: string
        recipientAddress:
          type: string
        amount:
          type: string
        token:
          type: string
        memo:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentRequestInput:
      type: object
      required: [recipientAddress, amount, token]
      properties:
        recipientAddress:
          type: string
          minLength: 1
        amount:
          type: string
          minLength: 1
        token:
          type: string
          enum: [USDC, ETH]
        memo:
          type: string

    PaymentRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: string

    PaymentStats:
      type: object
      required: [totalRequestsCreated, totalRequestsPaid, totalAmountRequested, pendingRequests, recentActivity]
      properties:
        totalRequestsCreated:
          type: integer
        totalRequestsPaid:
          type: integer
        totalAmountRequested:
          type: string
        pendingRequests:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AppConfig:
      type: object
      required: [appName, appVersion, deployerAddress, feeCollectorAddress, feeBps, network, chainId, verified, registeredAt]
      properties:
        appName:
          type: string
        appVersion:
          type: string
        deployerAddress:
          type: string
        feeCollectorAddress:
          type: string
        feeBps:
          type: integer
        routerAddress:
          type: ["string", "null"]
        network:
          type: string
        chainId:
          type: integer
        verified:
          type: boolean
        registeredAt:
          type: string
        updatedAt:
          type: string

    AppRegisterInput:
      type: object
      required: [deployerAddress, feeCollectorAddress]
      properties:
        deployerAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeCollectorAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeBps:
          type: integer
          minimum: 0
          maximum: 1000
        routerAddress:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
