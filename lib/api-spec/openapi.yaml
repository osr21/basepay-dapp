openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BasePay — USDC Payments on Base Network
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Address book contacts
  - name: payment-requests
    description: Shareable payment request links
  - name: stats
    description: Payment statistics
  - name: app
    description: dApp registration and configuration
  - name: gasless
    description: Gasless USDC transfers via EIP-3009 relayer
  - name: swap
    description: Gasless USDC↔EURC swaps via Aerodrome Finance + EIP-2612 permit relayer

  - name: stockflow
    description: Stock reference data, reviewed pilot trading and income proposals

paths:
  /stockflow/pilot/session:
    get:
      operationId: getStockflowPilotSession
      tags: [stockflow]
      responses:
        "200":
          description: Wallet session and current pilot access, checked afresh
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowPilotSession" }
  /stockflow/pilot/challenge:
    post:
      operationId: createStockflowPilotChallenge
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
      responses:
        "200":
          description: Single-use sign-in challenge
          content:
            application/json:
              schema:
                type: object
                required: [id, message]
                properties:
                  id: { type: string }
                  message: { type: string }
  /stockflow/pilot/auth:
    post:
      operationId: authenticateStockflowPilot
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, challengeId, signature]
              properties:
                address: { type: string }
                challengeId: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: HttpOnly wallet session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowPilotSession" }
  /stockflow/pilot/logout:
    post:
      operationId: logoutStockflowPilot
      tags: [stockflow]
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
  /stockflow/pilot/participants:
    get:
      operationId: listStockflowPilotParticipants
      tags: [stockflow]
      responses:
        "200":
          description: Administrator-only participant approvals
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StockflowPilotParticipant" } }
    post:
      operationId: saveStockflowPilotParticipant
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, countryCode, days, approved, reviewConfirmed]
              properties:
                wallet: { type: string }
                countryCode: { type: string }
                days: { type: integer, minimum: 1, maximum: 30 }
                approved: { type: boolean }
                reviewConfirmed: { type: boolean }
      responses:
        "200":
          description: Persisted approval or revocation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowPilotParticipant" }
  /stockflow/trading/quote:
    post:
      operationId: createStockflowTradeQuote
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockAddress, side, amount, slippageBps]
              properties:
                stockAddress: { type: string }
                side: { type: string, enum: [buy, sell] }
                amount:
                  type: string
                  description: Human-readable input quantity, USDC for buys or stock tokens for sells. Never raw integer units.
                  example: "0.1"
                slippageBps: { type: integer, minimum: 10, maximum: 100 }
      responses:
        "200":
          description: Real Aerodrome mainnet quote, not an NAV estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowTradeQuote" }
  /stockflow/trading/prepare:
    post:
      operationId: prepareStockflowTrade
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quoteId], properties: { quoteId: { type: string } } }
      responses:
        "200":
          description: Rechecks access, balance, allowance and transaction simulation
          content:
            application/json:
              schema:
                type: object
                required: [quote, balance, allowance, approvalRequired, simulated]
                properties:
                  quote: { $ref: "#/components/schemas/StockflowTradeQuote" }
                  balance: { type: string }
                  allowance: { type: string }
                  approvalRequired: { type: boolean }
                  simulated: { type: boolean }
  /stockflow/trading/history:
    get:
      operationId: listStockflowTradeHistory
      tags: [stockflow]
      responses:
        "200":
          description: Current wallet's recorded trades, with chain-verified receipt status
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StockflowTradeRecord" } }
    post:
      operationId: recordStockflowTrade
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockflowTradeSubmission"
      responses:
        "200":
          description: Transaction sender, target and calldata checked against stored quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowTradeRecord" }
  /stockflow/stocks:
    get:
      operationId: listStockflowStocks
      tags: [stockflow]
      summary: Live Coinbase tokenized stock reference catalogue, not trade quotes
      responses:
        "200":
          description: Reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockflowCatalogue"
        "503":
          description: Upstream reference data unavailable
  /stockflow/positions/{wallet}:
    get:
      operationId: getStockflowPositions
      tags: [stockflow]
      summary: Read public Base balances for catalogue stocks
      parameters:
        - in: path
          name: wallet
          required: true
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Onchain balances; failures are reported explicitly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockflowPositions"
        "400":
          description: Invalid wallet
        "503":
          description: RPC or catalogue unavailable
  /stockflow/income/{wallet}:
    parameters:
      - $ref: "#/components/parameters/StockflowWallet"
    get:
      operationId: getStockflowIncome
      tags: [stockflow]
      parameters:
        - $ref: "#/components/parameters/StockflowSignature"
        - $ref: "#/components/parameters/StockflowTimestamp"
      responses:
        "200":
          description: Persisted wallet-scoped receipts, policy snapshot and proposals. Never executes trades.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowIncome" }
        "400": { $ref: "#/components/responses/StockflowError" }
        "401": { $ref: "#/components/responses/StockflowError" }
    put:
      operationId: setStockflowIncomePolicy
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockflowIncomePolicyInput" }
      responses:
        "200":
          description: Saved income-planning policy; null pauses new proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowIncome" }
        "400": { $ref: "#/components/responses/StockflowError" }
        "401": { $ref: "#/components/responses/StockflowError" }
  /stockflow/income/{wallet}/sync:
    parameters:
      - $ref: "#/components/parameters/StockflowWallet"
    post:
      operationId: syncStockflowIncome
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockflowIncomeSyncInput" }
      responses:
        "200":
          description: Read-only Base ingestion, canonicality checks and idempotent proposal generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowIncome" }
        "400": { $ref: "#/components/responses/StockflowError" }
        "401": { $ref: "#/components/responses/StockflowError" }
        "503": { $ref: "#/components/responses/StockflowError" }
  /stockflow/income/{wallet}/proposals/{id}:
    parameters:
      - $ref: "#/components/parameters/StockflowWallet"
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 250 }
    patch:
      operationId: reviewStockflowProposal
      tags: [stockflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockflowProposalReviewInput" }
      responses:
        "200":
          description: Records a human review decision only. No trade or authorization is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockflowIncome" }
        "400": { $ref: "#/components/responses/StockflowError" }
        "401": { $ref: "#/components/responses/StockflowError" }
        "404": { $ref: "#/components/responses/StockflowError" }
        "409": { $ref: "#/components/responses/StockflowError" }
        "503": { $ref: "#/components/responses/StockflowError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: ownerAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Remove a contact (owner-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: ownerAddress
          in: query
          required: true
          schema:
            type: string
          description: Wallet address of the contact owner — only that owner's contact is deleted
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /payment-requests:
    get:
      operationId: listPaymentRequests
      tags: [payment-requests]
      summary: List payment requests for an address
      parameters:
        - name: recipientAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of payment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRequest"
    post:
      operationId: createPaymentRequest
      tags: [payment-requests]
      summary: Create a shareable payment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestInput"
      responses:
        "201":
          description: Payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /payment-requests/{id}:
    get:
      operationId: getPaymentRequest
      tags: [payment-requests]
      summary: Get a payment request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePaymentRequest
      tags: [payment-requests]
      summary: Mark payment request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestUpdate"
      responses:
        "200":
          description: Updated payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /swap/quote:
    get:
      operationId: getSwapQuote
      tags: [swap]
      summary: Get an Aerodrome quote for a USDC↔EURC swap
      parameters:
        - name: tokenIn
          in: query
          required: true
          schema: { type: string }
          description: Input token address
        - name: tokenOut
          in: query
          required: true
          schema: { type: string }
          description: Output token address
        - name: amountIn
          in: query
          required: true
          schema: { type: string }
          description: Input amount in atomic units (6 decimals)
      responses:
        "200":
          description: Swap quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapQuoteResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Pool unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /swap/execute:
    post:
      operationId: executeGaslessSwap
      tags: [swap]
      summary: Execute a gasless USDC↔EURC swap via EIP-2612 permit + Aerodrome relayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapInput"
      responses:
        "200":
          description: Swap relayed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Relay error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gasless/fee:
    get:
      operationId: getGaslessFee
      tags: [gasless]
      summary: Get gasless relay fee info
      responses:
        "200":
          description: Relay fee information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GaslessFeeInfo"

  /gasless/transfer:
    post:
      operationId: submitGaslessTransfer
      tags: [gasless]
      summary: Submit a gasless USDC transfer via EIP-3009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GaslessTransferInput"
      responses:
        "200":
          description: Transfer relayed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GaslessTransferResult"
        "400":
          description: Invalid input or nonce already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Relay failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/{address}:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get payment stats for a wallet address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStats"

  /app/config:
    get:
      operationId: getAppConfig
      tags: [app]
      summary: Get dApp registration and fee configuration
      responses:
        "200":
          description: App config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    post:
      operationId: registerApp
      tags: [app]
      summary: Register or update dApp configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegisterInput"
      responses:
        "200":
          description: Updated app config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

components:
  parameters:
    StockflowWallet:
      name: wallet
      in: path
      required: true
      schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    StockflowSignature:
      name: signature
      in: query
      required: true
      schema: { type: string, pattern: "^0x[0-9a-fA-F]+$", maxLength: 4096 }
    StockflowTimestamp:
      name: timestamp
      in: query
      required: true
      schema: { type: integer }
  responses:
    StockflowError:
      description: Invalid request, wallet proof, state conflict or unavailable chain data.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    StockflowPilotParticipant:
      type: object
      required: [wallet, countryCode, approved, expiresAt, reviewedBy, updatedAt]
      properties:
        wallet: { type: string }
        countryCode: { type: string }
        approved: { type: boolean }
        expiresAt: { type: string }
        reviewedBy: { type: string }
        updatedAt: { type: string }
    StockflowPilotSession:
      type: object
      required: [authenticated, address, isAdmin, enabled, approved, reason, participant]
      properties:
        authenticated: { type: boolean }
        address: { type: [string, "null"] }
        isAdmin: { type: boolean }
        enabled: { type: boolean }
        approved: { type: boolean }
        reason: { type: string }
        participant:
          anyOf:
            - { $ref: "#/components/schemas/StockflowPilotParticipant" }
            - { type: "null" }
    StockflowTradeQuote:
      type: object
      required: [id, chainId, wallet, stockAddress, symbol, side, router, factory, pool, tickSpacing, tokenIn, tokenOut, decimalsIn, decimalsOut, amountIn, amountOut, minimumOut, slippageBps, priceImpactBps, expiresAt, deadline, blockNumber]
      properties:
        id: { type: string }
        chainId: { type: integer }
        wallet: { type: string }
        stockAddress: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [buy, sell] }
        router: { type: string }
        factory: { type: string }
        pool: { type: string }
        tickSpacing: { type: integer }
        tokenIn: { type: string }
        tokenOut: { type: string }
        decimalsIn: { type: integer }
        decimalsOut: { type: integer }
        amountIn: { type: string }
        amountOut: { type: string }
        minimumOut: { type: string }
        slippageBps: { type: integer }
        priceImpactBps: { type: integer }
        expiresAt: { type: string }
        deadline: { type: integer }
        blockNumber: { type: string }
    StockflowTradeSubmission:
      type: object
      required: [quoteId, hash]
      properties:
        quoteId: { type: string }
        hash: { type: string, pattern: "^0x[a-fA-F0-9]{64}$" }
        replacementHashes:
          type: array
          maxItems: 20
          items: { type: string, pattern: "^0x[a-fA-F0-9]{64}$" }
        reviewedSwapFee:
          description: Client-reported estimate reviewed before signing, not an authoritative paid fee.
          anyOf:
            - { $ref: "#/components/schemas/StockflowNetworkFee" }
            - { type: "null" }
    StockflowNetworkFee:
      type: object
      description: Network cost in decimal wei strings. Null means unavailable, never zero. Excludes pool and service fees.
      required: [executionWei, l1DataWei, operatorWei, totalWei]
      properties:
        executionWei: { type: [string, "null"], pattern: "^[0-9]{1,78}$" }
        l1DataWei: { type: [string, "null"], pattern: "^[0-9]{1,78}$" }
        operatorWei: { type: [string, "null"], pattern: "^[0-9]{1,78}$" }
        totalWei: { type: [string, "null"], pattern: "^[0-9]{1,78}$" }
    StockflowTradeRecord:
      type: object
      required: [hash, originalHash, replacementHashes, quoteId, symbol, side, status, amountIn, amountOut, decimalsIn, decimalsOut, createdAt]
      properties:
        hash: { type: string }
        originalHash: { type: string }
        replacementHashes:
          type: array
          items: { type: string }
        quoteId: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [buy, sell] }
        status: { type: string, enum: [pending, confirmed, failed, cancelled, changed] }
        amountIn: { type: string }
        amountOut: { type: [string, "null"] }
        networkFees:
          anyOf:
            - { $ref: "#/components/schemas/StockflowNetworkFee" }
            - { type: "null" }
        reviewedSwapFee:
          anyOf:
            - { $ref: "#/components/schemas/StockflowNetworkFee" }
            - { type: "null" }
        decimalsIn: { type: integer }
        decimalsOut: { type: integer }
        createdAt: { type: string }
    StockflowAllocation:
      type: object
      required: [address, symbol, weight]
      properties:
        address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        symbol: { type: string, minLength: 1, maxLength: 30 }
        weight: { type: number, exclusiveMinimum: 0, maximum: 100 }
    StockflowIncomePolicy:
      type: object
      required: [id, name, incomePct, maxPerPurchase, dailyMax, expiresAt, allocations, status, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        incomePct: { type: number, exclusiveMinimum: 0, maximum: 100 }
        maxPerPurchase: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        dailyMax: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        expiresAt: { type: number }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: number }
        updatedAt: { type: number }
        allocations:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/StockflowAllocation" }
    StockflowIncomePolicyInput:
      type: object
      required: [policy, signature, timestamp]
      properties:
        policy:
          oneOf:
            - $ref: "#/components/schemas/StockflowIncomePolicy"
            - { type: "null" }
        signature: { type: string, maxLength: 4096 }
        timestamp: { type: integer }
    StockflowIncomeSyncInput:
      type: object
      required: [signature, timestamp]
      properties:
        signature: { type: string, maxLength: 4096 }
        timestamp: { type: integer }
        txHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
          description: Optional historical transaction to verify, outside the automatic scan window.
    StockflowProposalReviewInput:
      type: object
      required: [status, signature, timestamp]
      properties:
        status: { type: string, enum: [reviewed, dismissed] }
        signature: { type: string, maxLength: 4096 }
        timestamp: { type: integer }
    StockflowIncomeReceipt:
      type: object
      required: [id, txHash, logIndex, receiptIndex, token, tokenAddress, amountAtomic, sender, blockNumber, blockHash, receivedAt, confirmations, status, paymentRequestIds]
      properties:
        id: { type: string }
        txHash: { type: string }
        logIndex: { type: integer }
        receiptIndex:
          type: integer
          description: Stable transaction-local log offset used for identity across reorgs.
        token: { type: string, enum: [USDC, EURC] }
        tokenAddress: { type: string }
        amountAtomic: { type: string, pattern: "^[0-9]+$" }
        sender: { type: string }
        blockNumber: { type: string }
        blockHash: { type: string }
        receivedAt: { type: string }
        confirmations: { type: integer }
        status: { type: string, enum: [confirming, confirmed, orphaned] }
        paymentRequestIds:
          type: array
          items: { type: string }
    StockflowProposalLine:
      type: object
      required: [address, symbol, amountUsd]
      properties:
        address: { type: string }
        symbol: { type: string }
        amountUsd: { type: string }
    StockflowIncomeProposal:
      type: object
      required: [id, receiptId, policy, totalUsd, lines, status, reason, createdAt, reviewedAt]
      properties:
        id: { type: string }
        receiptId: { type: string }
        policy: { $ref: "#/components/schemas/StockflowIncomePolicy" }
        totalUsd: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StockflowProposalLine" }
        status: { type: string, enum: [pending_review, reviewed, dismissed, invalidated, blocked] }
        reason: { type: ["string", "null"] }
        createdAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
    StockflowIncome:
      type: object
      required: [wallet, chainId, requiredConfirmations, policy, receipts, proposals, scanStartBlock, scannedThroughBlock, scannedBlockHash, headBlock, syncedAt]
      properties:
        wallet: { type: string }
        chainId: { type: integer }
        requiredConfirmations: { type: integer }
        policy:
          oneOf:
            - $ref: "#/components/schemas/StockflowIncomePolicy"
            - { type: "null" }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/StockflowIncomeReceipt" }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/StockflowIncomeProposal" }
        scanStartBlock: { type: ["string", "null"] }
        scannedThroughBlock: { type: ["string", "null"] }
        scannedBlockHash: { type: ["string", "null"] }
        headBlock: { type: ["string", "null"] }
        syncedAt: { type: ["string", "null"] }
    StockflowStock:
      type: object
      required: [address, symbol, name, decimals, multiplier, referencePrice, priceUpdatedAt, iconUrl, pausedFeatures]
      properties:
        address: { type: string }
        symbol: { type: string }
        name: { type: string }
        decimals: { type: integer }
        multiplier: { type: ["number", "null"] }
        referencePrice: { type: ["number", "null"] }
        priceUpdatedAt: { type: ["string", "null"] }
        iconUrl: { type: ["string", "null"] }
        pausedFeatures:
          type: array
          items: { type: string }
    StockflowCatalogue:
      type: object
      required: [stocks, fetchedAt, source, chainId]
      properties:
        stocks:
          type: array
          items: { $ref: "#/components/schemas/StockflowStock" }
        fetchedAt: { type: string }
        source: { type: string }
        chainId: { type: integer }
    StockflowPosition:
      type: object
      required: [address, rawBalance, tokenBalance, shareBalance, referenceValue]
      properties:
        address: { type: string }
        rawBalance: { type: string }
        tokenBalance: { type: string }
        shareBalance: { type: ["string", "null"] }
        referenceValue: { type: ["number", "null"] }
    StockflowPositions:
      type: object
      required: [wallet, positions, failedReads, fetchedAt, blockNumber]
      properties:
        wallet: { type: string }
        positions:
          type: array
          items: { $ref: "#/components/schemas/StockflowPosition" }
        failedReads: { type: integer }
        fetchedAt: { type: string }
        blockNumber: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Contact:
      type: object
      required: [id, name, walletAddress, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        walletAddress:
          type: string
        ensName:
          type: ["string", "null"]
        ownerAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    ContactInput:
      type: object
      required: [name, walletAddress]
      properties:
        name:
          type: string
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
        ensName:
          type: string
        ownerAddress:
          type: string

    PaymentRequest:
      type: object
      required: [id, recipientAddress, amount, token, status, createdAt]
      properties:
        id:
          type: string
        recipientAddress:
          type: string
        amount:
          type: string
        token:
          type: string
        memo:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentRequestInput:
      type: object
      required: [recipientAddress, amount, token]
      properties:
        recipientAddress:
          type: string
          minLength: 1
        amount:
          type: string
          minLength: 1
        token:
          type: string
          enum: [USDC, ETH]
        memo:
          type: string

    PaymentRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: string

    PaymentStats:
      type: object
      required: [totalRequestsCreated, totalRequestsPaid, totalAmountRequested, pendingRequests, recentActivity]
      properties:
        totalRequestsCreated:
          type: integer
        totalRequestsPaid:
          type: integer
        totalAmountRequested:
          type: string
        pendingRequests:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AppConfig:
      type: object
      required: [appName, appVersion, deployerAddress, feeCollectorAddress, feeBps, network, chainId, verified, registeredAt]
      properties:
        appName:
          type: string
        appVersion:
          type: string
        deployerAddress:
          type: string
        feeCollectorAddress:
          type: string
        feeBps:
          type: integer
        routerAddress:
          type: ["string", "null"]
        network:
          type: string
        chainId:
          type: integer
        verified:
          type: boolean
        registeredAt:
          type: string
        updatedAt:
          type: string

    AppRegisterInput:
      type: object
      required: [deployerAddress, feeCollectorAddress]
      properties:
        deployerAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeCollectorAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeBps:
          type: integer
          minimum: 0
          maximum: 1000
        routerAddress:
          type: string

    GaslessFeeInfo:
      type: object
      required: [relayFeeUsdc, relayerReady, networkName]
      properties:
        relayFeeUsdc:
          type: string
          description: USDC fee charged per relay (e.g. "0.00" = free)
        relayerReady:
          type: boolean
          description: Whether the relayer wallet has enough ETH to submit txs
        relayerEthBalance:
          type: string
          description: Relayer ETH balance in ether (human-readable)
        networkName:
          type: string
          description: Network name (e.g. "Base Mainnet")

    GaslessTransferInput:
      type: object
      required: [from, to, value, validAfter, validBefore, nonce, v, r, s]
      properties:
        token:
          type: string
          description: >
            Token contract address (0x-prefixed). Must be in the relay whitelist.
            Defaults to USDC (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913).
        from:
          type: string
          description: Sender address (signer of the authorization)
        to:
          type: string
          description: Recipient address
        value:
          type: string
          description: Amount in token atomic units (6 decimals), as decimal string
        validAfter:
          type: string
          description: Unix timestamp after which the authorization is valid
        validBefore:
          type: string
          description: Unix timestamp before which the authorization expires
        nonce:
          type: string
          description: Random bytes32 nonce as hex string (0x-prefixed)
        v:
          type: integer
          description: Signature v component
        r:
          type: string
          description: Signature r component (0x-prefixed hex)
        s:
          type: string
          description: Signature s component (0x-prefixed hex)

    GaslessTransferResult:
      type: object
      required: [txHash, from, to, value, token]
      properties:
        txHash:
          type: string
          description: On-chain transaction hash of the relayed transfer
        token:
          type: string
          description: Token contract address that was transferred
        from:
          type: string
        to:
          type: string
        value:
          type: string
          description: Amount transferred in atomic units

    SwapQuoteResult:
      type: object
      required: [amountOut, amountOutMin, fee, protocolFeeBps, protocolFeeAmount, amountOutAfterFee, poolAddress]
      properties:
        amountOut:
          type: string
          description: Expected output amount in atomic units
        amountOutMin:
          type: string
          description: Minimum output amount after slippage guard
        fee:
          type: integer
          description: Aerodrome pool type indicator (100 = stable pool, 500 = volatile pool)
        protocolFeeBps:
          type: integer
          description: BasePay protocol fee in basis points (0 = free)
        protocolFeeAmount:
          type: string
          description: Protocol fee amount in atomic units (0 for current version)
        amountOutAfterFee:
          type: string
          description: Net output amount the user receives (= amountOut when fee is 0)
        poolAddress:
          type: string
          description: Aerodrome pool address used for the swap
        stable:
          type: boolean
          description: Whether the best Aerodrome pool is stable (true) or volatile (false)
        relayerAddress:
          type: string
          description: Relay wallet address — use as the EIP-3009 transferWithAuthorization recipient when signing

    SwapInput:
      type: object
      required: [tokenIn, tokenOut, amountIn, owner, stable, validAfter, validBefore, nonce, v, r, s]
      properties:
        tokenIn:
          type: string
          description: Input token contract address (USDC or EURC)
        tokenOut:
          type: string
          description: Output token contract address (USDC or EURC)
        amountIn:
          type: string
          description: Input amount in atomic units (6 decimals) as decimal string
        owner:
          type: string
          description: Wallet address of the token owner (signer of the EIP-3009 authorization)
        stable:
          type: boolean
          description: Whether to use the stable (true) or volatile (false) Aerodrome pool (from /swap/quote)
        validAfter:
          type: string
          description: EIP-3009 validAfter Unix timestamp (seconds, decimal string)
        validBefore:
          type: string
          description: EIP-3009 validBefore Unix timestamp (seconds, decimal string)
        nonce:
          type: string
          description: EIP-3009 random nonce (0x-prefixed 32-byte hex)
        v:
          type: integer
          description: Authorization signature v component (27 or 28)
        r:
          type: string
          description: Authorization signature r component (0x-prefixed 32-byte hex)
        s:
          type: string
          description: Authorization signature s component (0x-prefixed 32-byte hex)
        slippageBps:
          type: integer
          description: Acceptable slippage in basis points (0–100, default 50 = 0.5%)

    SwapResult:
      type: object
      required: [txHash, tokenIn, tokenOut, amountIn, amountOutAfterFee]
      properties:
        txHash:
          type: string
          description: On-chain hash of the Aerodrome pool.swap transaction (output arrives in user wallet from this tx)
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutAfterFee:
          type: string
          description: Net output amount received directly by the user from the pool

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
