openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BasePay — USDC Payments on Base Network
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Address book contacts
  - name: payment-requests
    description: Shareable payment request links
  - name: stats
    description: Payment statistics
  - name: app
    description: dApp registration and configuration
  - name: gasless
    description: Gasless USDC transfers via EIP-3009 relayer
  - name: swap
    description: Gasless USDC↔EURC swaps via Aerodrome Finance + EIP-2612 permit relayer

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: ownerAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Remove a contact (owner-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: ownerAddress
          in: query
          required: true
          schema:
            type: string
          description: Wallet address of the contact owner — only that owner's contact is deleted
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /payment-requests:
    get:
      operationId: listPaymentRequests
      tags: [payment-requests]
      summary: List payment requests for an address
      parameters:
        - name: recipientAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of payment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRequest"
    post:
      operationId: createPaymentRequest
      tags: [payment-requests]
      summary: Create a shareable payment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestInput"
      responses:
        "201":
          description: Payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /payment-requests/{id}:
    get:
      operationId: getPaymentRequest
      tags: [payment-requests]
      summary: Get a payment request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePaymentRequest
      tags: [payment-requests]
      summary: Mark payment request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestUpdate"
      responses:
        "200":
          description: Updated payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /swap/quote:
    get:
      operationId: getSwapQuote
      tags: [swap]
      summary: Get an Aerodrome quote for a USDC↔EURC swap
      parameters:
        - name: tokenIn
          in: query
          required: true
          schema: { type: string }
          description: Input token address
        - name: tokenOut
          in: query
          required: true
          schema: { type: string }
          description: Output token address
        - name: amountIn
          in: query
          required: true
          schema: { type: string }
          description: Input amount in atomic units (6 decimals)
      responses:
        "200":
          description: Swap quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapQuoteResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Pool unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /swap/execute:
    post:
      operationId: executeGaslessSwap
      tags: [swap]
      summary: Execute a gasless USDC↔EURC swap via EIP-2612 permit + Aerodrome relayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapInput"
      responses:
        "200":
          description: Swap relayed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Relay error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gasless/fee:
    get:
      operationId: getGaslessFee
      tags: [gasless]
      summary: Get gasless relay fee info
      responses:
        "200":
          description: Relay fee information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GaslessFeeInfo"

  /gasless/transfer:
    post:
      operationId: submitGaslessTransfer
      tags: [gasless]
      summary: Submit a gasless USDC transfer via EIP-3009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GaslessTransferInput"
      responses:
        "200":
          description: Transfer relayed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GaslessTransferResult"
        "400":
          description: Invalid input or nonce already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Relay failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/{address}:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get payment stats for a wallet address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStats"

  /app/config:
    get:
      operationId: getAppConfig
      tags: [app]
      summary: Get dApp registration and fee configuration
      responses:
        "200":
          description: App config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    post:
      operationId: registerApp
      tags: [app]
      summary: Register or update dApp configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegisterInput"
      responses:
        "200":
          description: Updated app config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Contact:
      type: object
      required: [id, name, walletAddress, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        walletAddress:
          type: string
        ensName:
          type: ["string", "null"]
        ownerAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    ContactInput:
      type: object
      required: [name, walletAddress]
      properties:
        name:
          type: string
          minLength: 1
        walletAddress:
          type: string
          minLength: 1
        ensName:
          type: string
        ownerAddress:
          type: string

    PaymentRequest:
      type: object
      required: [id, recipientAddress, amount, token, status, createdAt]
      properties:
        id:
          type: string
        recipientAddress:
          type: string
        amount:
          type: string
        token:
          type: string
        memo:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentRequestInput:
      type: object
      required: [recipientAddress, amount, token]
      properties:
        recipientAddress:
          type: string
          minLength: 1
        amount:
          type: string
          minLength: 1
        token:
          type: string
          enum: [USDC, ETH]
        memo:
          type: string

    PaymentRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidTxHash:
          type: string

    PaymentStats:
      type: object
      required: [totalRequestsCreated, totalRequestsPaid, totalAmountRequested, pendingRequests, recentActivity]
      properties:
        totalRequestsCreated:
          type: integer
        totalRequestsPaid:
          type: integer
        totalAmountRequested:
          type: string
        pendingRequests:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AppConfig:
      type: object
      required: [appName, appVersion, deployerAddress, feeCollectorAddress, feeBps, network, chainId, verified, registeredAt]
      properties:
        appName:
          type: string
        appVersion:
          type: string
        deployerAddress:
          type: string
        feeCollectorAddress:
          type: string
        feeBps:
          type: integer
        routerAddress:
          type: ["string", "null"]
        network:
          type: string
        chainId:
          type: integer
        verified:
          type: boolean
        registeredAt:
          type: string
        updatedAt:
          type: string

    AppRegisterInput:
      type: object
      required: [deployerAddress, feeCollectorAddress]
      properties:
        deployerAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeCollectorAddress:
          type: string
          minLength: 42
          maxLength: 42
        feeBps:
          type: integer
          minimum: 0
          maximum: 1000
        routerAddress:
          type: string

    GaslessFeeInfo:
      type: object
      required: [relayFeeUsdc, relayerReady, networkName]
      properties:
        relayFeeUsdc:
          type: string
          description: USDC fee charged per relay (human-readable, e.g. "0.30" for 0.3%)
        relayerReady:
          type: boolean
          description: Whether the relayer wallet has enough ETH to submit txs
        relayerEthBalance:
          type: string
          description: Relayer ETH balance in ether (human-readable)
        networkName:
          type: string
          description: Network name (e.g. "Base Mainnet")
        relayerAddress:
          type: string
          description: Relay wallet address — use as the EIP-3009 transferWithAuthorization recipient when signing gasless transfers
        feeBps:
          type: integer
          description: Protocol fee in basis points (e.g. 30 = 0.3%)

    GaslessTransferInput:
      type: object
      required: [from, to, recipient, value, validAfter, validBefore, nonce, v, r, s]
      properties:
        token:
          type: string
          description: >
            Token contract address (0x-prefixed). Must be in the relay whitelist.
            Defaults to USDC (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913).
        from:
          type: string
          description: Sender address (signer of the authorization)
        to:
          type: string
          description: >
            EIP-3009 authorization recipient — must equal the relay wallet address
            (obtained from GET /gasless/fee relayerAddress). The relay holds funds
            temporarily and forwards (value - fee) to recipient.
        recipient:
          type: string
          description: Actual end-recipient address — where (value - protocolFee) is delivered
        value:
          type: string
          description: Amount in token atomic units (6 decimals), as decimal string
        validAfter:
          type: string
          description: Unix timestamp after which the authorization is valid
        validBefore:
          type: string
          description: Unix timestamp before which the authorization expires
        nonce:
          type: string
          description: Random bytes32 nonce as hex string (0x-prefixed)
        v:
          type: integer
          description: Signature v component
        r:
          type: string
          description: Signature r component (0x-prefixed hex)
        s:
          type: string
          description: Signature s component (0x-prefixed hex)

    GaslessTransferResult:
      type: object
      required: [txHash, from, to, recipient, value, token, feeAmount, feeBps]
      properties:
        txHash:
          type: string
          description: On-chain transaction hash of the relayed transfer
        token:
          type: string
          description: Token contract address that was transferred
        from:
          type: string
        to:
          type: string
          description: EIP-3009 authorization recipient (relay wallet address)
        recipient:
          type: string
          description: Actual end-recipient address that received (value - feeAmount)
        value:
          type: string
          description: Gross amount in atomic units (as signed in the EIP-3009 authorization)
        feeAmount:
          type: string
          description: Protocol fee deducted in atomic units
        feeBps:
          type: integer
          description: Protocol fee rate in basis points

    SwapQuoteResult:
      type: object
      required: [amountOut, amountOutMin, fee, protocolFeeBps, protocolFeeAmount, amountOutAfterFee, poolAddress]
      properties:
        amountOut:
          type: string
          description: Expected output amount in atomic units
        amountOutMin:
          type: string
          description: Minimum output amount after slippage guard
        fee:
          type: integer
          description: Aerodrome pool type indicator (100 = stable pool, 500 = volatile pool)
        protocolFeeBps:
          type: integer
          description: BasePay protocol fee in basis points (0 = free)
        protocolFeeAmount:
          type: string
          description: Protocol fee amount in atomic units (0 for current version)
        amountOutAfterFee:
          type: string
          description: Net output amount the user receives (= amountOut when fee is 0)
        poolAddress:
          type: string
          description: Aerodrome pool address used for the swap
        stable:
          type: boolean
          description: Whether the best Aerodrome pool is stable (true) or volatile (false)
        relayerAddress:
          type: string
          description: Relay wallet address — use as the EIP-3009 transferWithAuthorization recipient when signing

    SwapInput:
      type: object
      required: [tokenIn, tokenOut, amountIn, owner, stable, validAfter, validBefore, nonce, v, r, s]
      properties:
        tokenIn:
          type: string
          description: Input token contract address (USDC or EURC)
        tokenOut:
          type: string
          description: Output token contract address (USDC or EURC)
        amountIn:
          type: string
          description: Input amount in atomic units (6 decimals) as decimal string
        owner:
          type: string
          description: Wallet address of the token owner (signer of the EIP-3009 authorization)
        stable:
          type: boolean
          description: Whether to use the stable (true) or volatile (false) Aerodrome pool (from /swap/quote)
        validAfter:
          type: string
          description: EIP-3009 validAfter Unix timestamp (seconds, decimal string)
        validBefore:
          type: string
          description: EIP-3009 validBefore Unix timestamp (seconds, decimal string)
        nonce:
          type: string
          description: EIP-3009 random nonce (0x-prefixed 32-byte hex)
        v:
          type: integer
          description: Authorization signature v component (27 or 28)
        r:
          type: string
          description: Authorization signature r component (0x-prefixed 32-byte hex)
        s:
          type: string
          description: Authorization signature s component (0x-prefixed 32-byte hex)
        slippageBps:
          type: integer
          description: Acceptable slippage in basis points (0–100, default 50 = 0.5%)

    SwapResult:
      type: object
      required: [txHash, tokenIn, tokenOut, amountIn, amountOutAfterFee]
      properties:
        txHash:
          type: string
          description: On-chain hash of the Aerodrome pool.swap transaction (output arrives in user wallet from this tx)
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutAfterFee:
          type: string
          description: Net output amount received directly by the user from the pool

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
